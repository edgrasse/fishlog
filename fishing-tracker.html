<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1507">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
<title>🎣 Fish Log</title>
<script>
// Reload once when a newer version is published (helps iOS home-screen apps).
try { var CV='fishlog-v4.0-20261108', st=localStorage.getItem('fishlog-cache-version'); localStorage.setItem('fishlog-cache-version',CV); if(st&&st!==CV){ location.reload(); } } catch(e){}
</script>
<style>:root{--bg:#0e1a0a;--s1:#172612;--s2:#1f3318;--bd:#33512a;--tx:#eaf5da;--mu:#a9c28b;--ac:#7ccd3a;--acd:#0b1405;--wn:#f0c040;--dn:#ff8f80;--bl:#6aa0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{min-height:100vh;min-height:100dvh}
#app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;width:100%;min-height:46px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
textarea{min-height:90px;resize:vertical}
h1,h2,h3{font-family:Georgia,serif;font-weight:700}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a1507,#12200c);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.top .logo{font-family:Georgia,serif;font-size:20px;font-weight:700}
.top .ver{font-size:12px;color:var(--mu)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;border:1px solid var(--bd);background:var(--s1)}
.pill.warn{border-color:var(--wn);color:var(--wn)}.pill.bad{border-color:var(--dn);color:var(--dn)}
.body{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b1507;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:600px;align-items:stretch}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;min-height:60px;font-size:12px;color:var(--mu)}
.nav button .ic{font-size:22px;line-height:1}
.nav button.on{color:var(--ac);font-weight:700}
.nav .fab{flex:0 0 74px;position:relative}
.nav .fab span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--ac);color:var(--acd);font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.6);border:4px solid #0b1507}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:12px;font-weight:700;border:1px solid var(--bd);background:var(--s2)}
.btn.pri{background:var(--ac);color:var(--acd);border-color:var(--ac)}
.btn.dng{border-color:var(--dn);color:var(--dn)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.big{font-size:30px;font-weight:700;font-family:Georgia,serif;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--s1);font-size:15px}
.chip.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.chip.sm{min-height:30px;padding:3px 10px;font-size:13px}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:13px}
.lbl{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px;font-weight:700}
.field{margin-bottom:14px}
.sect{margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.thumbs{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal .ph{position:relative}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--bd);cursor:pointer}
.xbtn{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);font-size:24px;font-weight:700}
.stepper .n{min-width:36px;text-align:center;font-size:22px;font-weight:700}
.stepper.rel button{background:#14243a;border-color:#2c4a73}
.catch{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:88vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:12px;font-size:20px}
.dlg{align-items:center;padding:20px}.dlg .sheet{border-radius:16px;border:1px solid var(--bd);max-width:380px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:576px;margin:0 auto;background:#21381a;border:1px solid var(--ac);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.toast.err{border-color:var(--dn);background:#3a1c18}
.toast .t{flex:1}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;border:1px solid var(--wn);background:#2a2410}
.banner.bad{border-color:var(--dn);background:#331a16}
.banner.ok{border-color:var(--ac);background:#17290f}
.bar{height:12px;border-radius:6px;background:var(--s2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.search{position:relative;margin-bottom:10px}
.mapbox{height:calc(100vh - 230px);min-height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--mu);font-size:16px;margin-bottom:6px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0}.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu)}.pin-dot.f{background:var(--ac);border-color:var(--ac)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.numpad button{height:64px;border-radius:16px;background:var(--s2);border:1px solid var(--bd);font-size:26px;font-weight:700}
.center{text-align:center}
.auth{padding:28px 20px 40px}
.uopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;min-height:64px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.swatch.on{border-color:#fff}
.icopt{width:48px;height:48px;border-radius:12px;font-size:26px;background:var(--s1);border:2px solid var(--bd)}.icopt.on{border-color:var(--ac)}
.hdr-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);gap:10px}
.kv:last-child{border-bottom:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:80;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);font-size:22px;color:#fff}
.lightbox .pv,.lightbox .nx{position:absolute;top:50%;width:48px;height:64px;font-size:30px;color:#fff;background:rgba(255,255,255,.12);border-radius:10px;transform:translateY(-50%)}
.lightbox .pv{left:8px}.lightbox .nx{right:8px}
.ptr{text-align:center;color:var(--mu);font-size:13px;height:0;overflow:hidden;transition:height .15s}
.sticky-save{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%);padding:18px 0 10px;z-index:15}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
details>summary{list-style:none;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'▾';color:var(--mu)}
details[open]>summary::after{content:'▴'}
.leaflet-container{background:#1a2a16;font-family:inherit}
</style>
</head>
